# Sony BDV-E2100 remote — Home Assistant dashboard card
# Dashboard > Edit > Add card > Manual. Paste this complete file.
# Replace EVERY remote.sony_device_remote with your actual remote entity ID.
# Uses only built-in Home Assistant cards; no additional frontend installation.
# All 70 commands advertised by the tested BDV-E2100 are included once.
# Buttons send individual key presses, not a named-input or absolute-volume setting.
# The integration does not implement press-and-hold; hold/double-tap are disabled.
# Reference: https://www.home-assistant.io/dashboards/button/
# Reference: https://www.home-assistant.io/dashboards/actions/

type: vertical-stack
cards:
- type: entity
  entity: remote.sony_device_remote
  name: Sony BDV-E2100
  icon: 'mdi:remote-tv'
- type: grid
